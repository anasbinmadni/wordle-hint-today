name: Deploy Wordle Hint to Cloudflare Workers

on:
  push:
    branches:
      - main # Agar aapki branch ka naam 'master' hai, toh isko 'master' kar dein

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Project (with Ninja Trick)
        run: |
          mv wrangler.toml wrangler-temp.toml
          npm run build
          mv wrangler-temp.toml wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy